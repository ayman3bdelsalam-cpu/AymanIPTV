name: Build APK with Updates

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q -o "$ZIP_FILE" -d temp_extract
            PROJECT_ROOT=$(find temp_extract -name "settings.gradle*" -exec dirname {} \; | head -n 1)
            shopt -s dotglob
            cp -rf "$PROJECT_ROOT"/* .
            rm -rf temp_extract
          fi

      - name: Apply Clean Fullscreen Patch
        run: |
          PLAYER_FILE="app/src/main/java/com/ayman/smartiptv/ui/screens/PlayerScreen.kt"
          if [ -f "$PLAYER_FILE" ]; then
            # تفعيل وضع ملء الشاشة الكامل وإخفاء أشرطة النظام باستخدام المسارات الكاملة لتجنب تعارض الـ imports
            sed -i 's/useController = true/useController = true\n            (context as? android.app.Activity ?: (context as? android.content.ContextWrapper)?.baseContext as? android.app.Activity)?.window?.let { window ->\n                val controller = androidx.core.view.WindowCompat.getInsetsController(window, window.decorView)\n                controller.systemBarsBehavior = androidx.core.view.WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE\n                controller.hide(androidx.core.view.WindowInsetsCompat.Type.systemBars())\n            }/g' "$PLAYER_FILE"

            # ضبط إخفاء أزرار التحكم تلقائياً
            sed -i 's/controllerShowTimeoutMs = [0-9]*/controllerShowTimeoutMs = 2500/g' "$PLAYER_FILE"
            sed -i 's/controllerHideOnTouch = false/controllerHideOnTouch = true/g' "$PLAYER_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AymanIPTV-Updated
          path: app/build/outputs/apk/debug/*.apk
