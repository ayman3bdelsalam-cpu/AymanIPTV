name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Unzip and Prepare Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -q "$ZIP_FILE" -d temp_extract
          PROJECT_ROOT=$(find temp_extract -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          shopt -s dotglob
          cp -rf "$PROJECT_ROOT"/* .
          rm -rf temp_extract
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: AymanIPTV-App
        path: app/build/outputs/apk/debug/*.apk
