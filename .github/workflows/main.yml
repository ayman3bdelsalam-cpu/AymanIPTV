name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Unzip and Prepare Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          unzip -q "$ZIP_FILE" -d temp_extract
          PROJECT_ROOT=$(find temp_extract -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          shopt -s dotglob
          cp -rf "$PROJECT_ROOT"/* .
          rm -rf temp_extract
        fi

    - name: Fix Plugin Management Repositories
      run: |
        cat << 'EOF' > settings.gradle.kts.tmp
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF
        if [ -f settings.gradle.kts ]; then
          cat settings.gradle.kts >> settings.gradle.kts.tmp
          mv settings.gradle.kts.tmp settings.gradle.kts
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AymanIPTV-App
        path: app/build/outputs/apk/debug/*.apk
